{% extends "base.html" %}{% set title="Party Planner" %}{% block content %}<main><div class="card form"><h1>Party Budget Planner</h1><form id="form"><label>Budget (₹)</label><input id="budget" type="number" min="1" required><label>Guests</label><input id="guests" type="number" min="1" required><label>Event type</label><input id="event_type" placeholder="Birthday, wedding, corporate" required><label>Venue preference</label><input id="venue" value="flexible"><label>City</label><input id="city" placeholder="Chennai"><label>Preferences</label><textarea id="preferences"></textarea><button>Generate recommendations</button></form></div><div id="result" class="result hidden"></div></main><script>form.onsubmit=async e=>{e.preventDefault();try{renderResult(await api('/generate-party',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({budget:Number(budget.value),guests:Number(guests.value),event_type:event_type.value,venue:venue.value,city:city.value,preferences:preferences.value})}))}catch(x){alert(x.message)}}</script>{% endblock %}
