{% extends "base.html" %}{% set title="History" %}{% block content %}<main><h1>Recommendation History</h1><div id="list" class="grid">Loading...</div></main><script>document.addEventListener("DOMContentLoaded", async function () {
    try {
        const rows = await api("/api/history");
        const list = document.getElementById("list");

        list.innerHTML = rows.length
            ? rows.map(r => `
                <div class="card">
                    <span class="badge">${esc(r.planner)}</span>
                    <h3>Plan #${r.id}</h3>
                    <p class="muted">${esc(r.created_at)}</p>
                    <a class="button secondary" target="_blank"
                       href="/recommendations-details/${r.id}">
                       View JSON
                    </a>
                </div>
            `).join("")
            : "<p>No plans yet.</p>";

    } catch (e) {
        console.log(e);
    }
});</script>{% endblock %}
