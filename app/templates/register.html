{% extends "base.html" %}{% set title="Register" %}{% block content %}<main><div class="card form"><h1>Create account</h1><form id="form"><label>Email</label><input id="email" type="email" required><label>Password</label><input id="password" type="password" minlength="8" required><button>Register</button></form><p id="msg"></p></div></main><script>form.onsubmit=async e=>{e.preventDefault();try{await api('/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,password:password.value})});msg.textContent='Registration successful. Redirecting...';setTimeout(()=>location.href='/login',600)}catch(x){msg.textContent=x.message}}</script>{% endblock %}
