{% extends "base.html" %}{% set title="Home Planner" %}{% block content %}<main><div class="card form"><h1>Home Interior Budget Planner</h1><form id="form"><label>Budget (₹)</label><input id="budget" type="number" min="1" required><label>Room type</label><input id="room_type" placeholder="Living Room" required><label>Style</label><select id="style"><option>modern</option><option>minimal</option><option>scandinavian</option><option>traditional</option></select><label>Items</label><textarea id="items" placeholder="lighting x2, furniture x1, decor x3"></textarea><button>Generate recommendations</button></form></div><div id="result" class="result hidden"></div></main><script>form.onsubmit=async e=>{e.preventDefault();try{const arr=items.value.split(',').map(s=>s.trim()).filter(Boolean).map(s=>{const m=s.match(/^(.*?)(?:\s+x(\d+))?$/i);return{category:m[1].trim(),quantity:Number(m[2]||1),notes:''}});renderResult(await api('/generate-home',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({budget:Number(budget.value),room_type:room_type.value,style:style.value,items:arr})}))}catch(x){alert(x.message)}}</script>{% endblock %}
