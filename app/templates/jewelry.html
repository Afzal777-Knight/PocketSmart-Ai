{% extends "base.html" %}{% set title="Jewelry Planner" %}{% block content %}<main><div class="card form"><h1>Jewelry Budget Planner</h1><form id="form"><label>Budget (₹)</label><input name="budget" type="number" min="1" required><label>Occasion</label><input name="occasion" placeholder="Wedding, party, dinner" required><label>Style</label><select name="style"><option>elegant</option><option>minimal</option><option>statement</option><option>classic</option></select><label>Outfit description</label><textarea name="outfit_description" placeholder="Color, neckline, fabric..."></textarea><label>Optional outfit image</label><input name="outfit_image" type="file" accept="image/*"><button>Generate recommendations</button></form><p class="muted">With Gemini configured, the image can be sent to the multimodal model.</p></div><div id="result" class="result hidden"></div></main><script>form.onsubmit=async e=>{e.preventDefault();try{renderResult(await api('/generate-jewelry',{method:'POST',body:new FormData(form)}))}catch(x){alert(x.message)}}</script>{% endblock %}
